; ─────────────────────────────────────────────────────────────
; AVL_CARL firmware — PlatformIO monorepo
; One [env] per node. Shared code lives in lib/ (carl_protocol, heartbeat, common).
;
;   pio run -e throttle              build/flash ONLY the throttle node
;   pio run -e master               build/flash ONLY the master node
;   pio run -e steering             build/flash ONLY the steering node
;   pio run                         build all firmware envs
;   pio run -e throttle -t upload   flash a connected Teensy throttle node
;   pio run -e master   -t upload   flash the NUCLEO over ST-LINK
;   pio test -e native              run host unit tests (no hardware)
;
; Boot/flash protocols differ per chip family:
;   • Teensy 4.1  -> Teensy Loader (HalfKay). `-t upload` invokes it; tap the
;                    on-board button if it doesn't auto-reboot into the bootloader.
;   • NUCLEO-F767 -> on-board ST-LINK (SWD). `upload_protocol = stlink`.
;                    The same USB cable also exposes the Virtual COM Port the
;                    teleop script talks to.
; See README.md for details.
; ─────────────────────────────────────────────────────────────

[platformio]
src_dir = .
; src_dir defaults to "src"; each env filters to its own node folder below.

; Shared settings for both Teensy nodes.
[teensy_base]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/Encoder
; FlexCAN_T4 ships with the Teensy core — no lib_deps entry needed.

[env:master]
platform = ststm32
board = nucleo_f767zi
framework = arduino

build_src_filter =
    -<*>
    +<master/src/**>

monitor_speed = 115200
upload_protocol = stlink

build_flags =
    -D HAL_CAN_MODULE_ENABLED

lib_deps =
    pazi88/STM32_CAN

[env:throttle]
extends = teensy_base

build_src_filter =
    -<*>
    +<throttle/src/**>

[env:steering]
extends = teensy_base

build_src_filter =
    -<*>
    +<steering/src/**>

; ── Host unit tests (no board) ──────────────────────────────────────────────
; Builds only the pure, Arduino-free protocol headers (carl_protocol, messages,
; common) and runs Unity tests under test/. Excludes node sources.
[env:native]
platform = native
build_src_filter = -<*>
test_framework = unity
[env:imu_test]
platform = ststm32
board = nucleo_f767zi
framework = arduino

build_src_filter =
    -<*>
    +<imu_test/src/**>

monitor_speed = 115200
upload_protocol = stlink